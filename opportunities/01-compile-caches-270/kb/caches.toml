# ---------------------------------------------------------------------------------------
# vLLM 0.32.0
# ---------------------------------------------------------------------------------------
[[cache]]
id = "vllm.torch_compile"
name = "vLLM torch.compile artifacts (default: AOT + mega artifact under torch_aot_compile/<sha256>)"
libraries = ["vllm"]
engines = ["vllm"]
vars = ["VLLM_CACHE_ROOT"]
patterns = ["{VLLM_CACHE_ROOT}/torch_compile_cache"]
redirect = "vllm"
key = ["~240 VLLM_* env vars minus an ignore list (CUDA_HOME, VLLM_DP_RANK, side-channel ports are hashed)", "VllmConfig hash incl. vLLM version and the model PATH string", "GPU name, torch CUDA, Triton key, torch hash", "forward qualname and line"]
write = "model.<pid>.tmp + os.replace, no lock; a corrupt file recompiles"
lock = "none"
relocatable = "yes"
readonly_ok = "no"
notes = "Per checkpoint path: ModelConfig.compute_hash does not ignore `model`, so a moved or renamed checkpoint, or each new Apertus checkpoint, misses. VLLM_CACHE_ROOT itself is excluded from the hash, so relocating the root is fine. Even a hit writes <hash>/inductor_cache and creates a dummy cache dir, so it needs a writable root."
evidence = ["vllm.layout.compile_dir", "vllm.key.compile_factors", "vllm.layout.aot_dir", "vllm.default.aot_on", "vllm.key.model_path_in_hash", "vllm.key.all_fields", "vllm.key.model_field", "vllm.key.cache_root_ignored", "vllm_aot.default.dir", "vllm_aot.key.factors", "vllm_aot_io.write.tmp_name", "vllm_aot_io.write.replace", "vllm_aot_io.read.dummy_dir", "vllm_root.key.cuda_home_hashed", "vllm_root.key.dp_rank_hashed", "vllm.write.binary_safe", "vllm.write.unpacked_unsafe"]

