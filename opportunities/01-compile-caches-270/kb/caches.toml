vars = ["DG_JIT_CACHE_DIR"]
patterns = [
  "{DG_JIT_CACHE_DIR}",
  "{VLLM_CACHE_ROOT}/deep_gemm",        # vLLM sets it when unset or empty
  "{SGLANG_CACHE_DIR}/deep_gemm",       # SGLang overwrites it from SGLANG_DG_CACHE_DIR
