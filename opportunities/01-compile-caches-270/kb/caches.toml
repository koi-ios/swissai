]
redirect = "deep_gemm"
key = ["cutlass version, full `nvcc --version` text", "NVCC flags incl. sm_90a / 100f", "source + deep_gemm header contents", "NOT include paths, NOT implicit env"]
write = "build in <root>/tmp/<pid-rand>, fsync, write .committed, rename the entry dir into <root>/cache/<tag>.<digest>/; no lock"
