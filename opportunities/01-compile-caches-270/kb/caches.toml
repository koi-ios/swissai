# cache-audit knowledge base: which variable relocates which on-disk cache.
#
# Versions: the platform's images, sglang_base = SGLang 0.5.20, vllm_base = vLLM 0.32.0
# (both torch 2.13.0 -> Triton 3.7.1, apache-tvm-ffi 0.1.11, TileLang 0.1.12;
#  FlashInfer 0.6.18 (SGLang) / 0.7.0.post1 (vLLM); DeepGEMM via DeepJIT).
#
# patterns: path templates; {VAR} resolves from the run's env or the library default;
#   "*" matches one path segment. A pattern that is exactly one of the entry's own vars
#   applies only when that var is set. Longest (most literal) match wins.
# evidence: citation ids (kb/engines.citations.json, research/*.citations.json); every one is
#   checked against the vendored source at the shipped version (tests/test_kb_citations.py).
# relocatable: does a copy at another absolute path still hit?   readonly_ok: does a hit work
#   on a read-only copy?   yes | no | partial | unknown. "measured" = local cache-audit run.

# ---------------------------------------------------------------------------------------
# Triton and PyTorch
# ---------------------------------------------------------------------------------------
[[cache]]
id = "triton"
name = "Triton kernels (cubin, PTX, TTIR/TTGIR, metadata) and, with TRITON_CACHE_AUTOTUNING, autotune results"
libraries = ["triton"]
engines = ["sglang", "vllm"]
vars = ["TRITON_CACHE_DIR"]
patterns = [
  "{TRITON_CACHE_DIR}",
  "{TRITON_HOME}/.triton/cache",
  "{SGLANG_CACHE_DIR}/triton",                                    # SGLang 0.5.20 import-time setdefault
  "{TORCHINDUCTOR_CACHE_DIR}/triton",                             # Inductor default when TRITON_CACHE_DIR unset
  "{TMPDIR}/torchinductor_{SANITIZED_USER}/triton",
  "{SGLANG_CACHE_DIR}/inductor/triton",
  "{VLLM_CACHE_ROOT}/torch_compile_cache/*/triton_cache",         # vLLM legacy adaptor
  "{VLLM_CACHE_ROOT}/torch_compile_cache/*/inductor_cache/triton",
  "{VLLM_CACHE_ROOT}/torch_compile_cache/torch_aot_compile/*/inductor_cache/triton",  # vLLM default (AOT)
]
redirect = "triton"
key = ["triton_key(): Triton version + frontend/backend sources + libtriton", "kernel source and line number", "ptxas version + target arch", "options, extern libs by content", "cache-invalidating env vars"]
write = "per file: temp dir tmp.pid_<pid>_<uuid4> inside the cache dir, then os.replace; group index written last; no lock"
lock = "none"
relocatable = "no"
readonly_ok = "partial"
notes = "Group files store ABSOLUTE child paths and get_group drops children whose path no longer exists, so a moved cache silently misses: always read and write it at one fixed absolute path. A hit works read-only; a miss crashes at makedirs. Unset, it lands per Inductor dir (per rank, per vLLM compile hash): set it explicitly so Triton kernels are shared across checkpoints."
evidence = ["triton.reloc.group_abs", "triton.write.tmpdir", "triton.write.replace", "triton_store.reloc.abs_child_paths", "triton_store.read.missing_children_dropped", "triton_store.write.group_last", "triton_store.read.makedirs_on_lookup", "triton.env.cache_dir", "triton.default.dot_triton", "triton.key.cache_key", "triton.key.ptxas_arch", "inductor.engine.triton_dir_only_if_unset", "sglang.engine.redirect_triton", "vllm.engine.triton_autotune_cache"]

[[cache]]
id = "inductor"
name = "TorchInductor caches (generated code, compiled .so, autotune .best_config)"
libraries = ["torch"]
engines = ["sglang", "vllm"]
vars = ["TORCHINDUCTOR_CACHE_DIR"]
patterns = [
  "{TORCHINDUCTOR_CACHE_DIR}",
  "{TMPDIR}/torchinductor_{SANITIZED_USER}",
  "/tmp/torchinductor_{SANITIZED_USER}",
  "{SGLANG_CACHE_DIR}/inductor",
  "{VLLM_CACHE_ROOT}/torch_compile_cache/*/inductor_cache",
  "{VLLM_CACHE_ROOT}/torch_compile_cache/torch_aot_compile/*/inductor_cache",
]
redirect = "inductor"
key = ["torch version + source hash (torch_key)", "FX graph and inputs", "inductor config", "system info: GPU name (not compute capability), torch CUDA version, Triton key"]
write = "temp file .<pid>.<thread id>.tmp in the same dir + rename (write_atomic)"
lock = "filelock files under <cache>/locks, also taken on a hit"
relocatable = "yes"
readonly_ok = "no"
notes = "Measured (torch 2.13.0, CPU): a moved copy hit with zero rewrites; a read-only copy crashed with PermissionError on <cache>/locks/*.lock. The temp name has no random part, so two nodes with equal pid and thread id writing one shared dir can interleave. No key includes the driver version. vLLM overwrites TORCHINDUCTOR_CACHE_DIR with its per-compile-hash dir (decorators.py, AOT path), and that hash includes the checkpoint path, so under vLLM this cache is per checkpoint. Default is in TMPDIR, lost with the job even on a persistent HOME."
evidence = ["inductor.env.cache_dir_var", "inductor.engine.setdefault", "inductor.default.tmp", "inductor.lock.dir", "inductor.lock.lock_dir", "inductor.write.tmpname", "inductor.write.rename", "fxgraph.key.device_name", "fxgraph.key.cuda_version", "fxgraph.key.triton_key", "sglang.engine.redirect_inductor", "vllm_aot.engine.inductor_override", "vllm.key.model_path_in_hash", "vllm.engine.inductor_threads"]

