# The enforceable part of upstream/vllm.md. Scripts read this file; people read the card.
# Patterns are regular expressions. signoff: required | optional | absent. ai_trailer: keep | forbid.
# pr_footer (the "Generated with Claude Code" line): keep | forbid | either.

repo = "vllm-project/vllm"
default_branch = "main"
branch_pattern = '^[A-Za-z0-9][A-Za-z0-9._/-]*$'                        # no rule; PRs come from forks
subject_pattern = '^(\[[^\]\[]+\])+ +\S.*$'                             # pr-title.yml:34
subject_max = 120
no_pr_suffix = true
signoff = "required"             # DCO; by the human with `git commit -s`, never by a script
ai_trailer = "keep"              # AGENTS.md:135-144 asks for one on AI-assisted commits
drop_trailers = ["Claude-Session", "Entire-Checkpoint"]
pr_sections = [["Overview"], ["Claims"], ["Validation"], ["Details"]]
pr_must_contain = ["AI assistance"]   # the disclosure sentence and the ticked box
pr_footer = "either"
max_lines_warn = 500             # above this, an RFC issue first (README.md:312-317)

[[checks]]
name = "pre-commit, all hooks. Also run the touched tests; the card lists the commands and the duplicate search"
cwd = "."
cmd = "pre-commit run --all-files"
