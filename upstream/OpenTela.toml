# The enforceable part of upstream/OpenTela.md. Scripts read this file; people read the card.
# Patterns are regular expressions. signoff: required | optional | absent. ai_trailer: keep | forbid.
# pr_footer (the "Generated with Claude Code" line): keep | forbid | either.

repo = "eth-easl/OpenTela"
default_branch = "main"
branch_pattern = '^(fix|feat|docs|chore)/[a-z0-9][a-z0-9-]*$'          # observed: fix/self-row-sweep (#65)
subject_pattern = '^(feat|fix|docs|chore|refactor|test|ci|perf|build)(\([a-z0-9_./-]+\))?: \S.*[^.]$'
subject_max = 100
no_pr_suffix = true              # the squash merge adds (#N)
signoff = "absent"               # 0 of the last 100 commits
ai_trailer = "keep"              # observed on a third of commits, maintainer's included; no written rule
drop_trailers = ["Claude-Session", "Entire-Checkpoint"]
pr_sections = [["Problem"], ["Change", "Fix"], ["Testing", "Tests"]]
pr_footer = "keep"               # outside PRs #67, #68, #63, #64 carry it
max_lines_warn = 1500

[env]
GOFLAGS = "-mod=mod"
GOPROXY = "off"                  # the checks must not download modules
GOTOOLCHAIN = "local"

[[checks]]
name = "go vet"
cwd = "src"
cmd = "go vet ./..."

[[checks]]
name = "unit tests with the race detector (the flags of `make test`, without its download of gotestsum)"
cwd = "src"
cmd = "go test -race -count=1 ./..."

[[checks]]
name = "lint: golangci-lint v2.15, as CI runs it"
cwd = "src"
cmd = "golangci-lint run --timeout=5m"
