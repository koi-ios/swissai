# The enforceable part of upstream/model-launch.md. Scripts read this file; people read the card.
# Patterns are regular expressions. signoff: required | optional | absent. ai_trailer: keep | forbid.
# pr_footer (the "Generated with Claude Code" line): keep | forbid | either.

repo = "swiss-ai/model-launch"
default_branch = "main"
branch_pattern = '^(feat|fix|chore|docs|ci)/[a-z0-9][a-z0-9.-]*$'      # AGENTS.md:7
subject_pattern = '^(launchers|envs|images|docs?|ci|examples|catalog|cli|tests?): \S.*[^.]$'
subject_max = 100
no_pr_suffix = true
signoff = "absent"               # 0 of the last 100; no DCO or CLA found
ai_trailer = "keep"              # 34 of the last 100; no written rule
drop_trailers = ["Claude-Session", "Entire-Checkpoint"]
pr_sections = [["Summary", "Problem", "Why"], ["Testing", "Test plan", "Tests"]]
pr_footer = "keep"               # 26 of 50 recent PR bodies
max_lines_warn = 1000

[[checks]]
name = "static checks: ruff, mypy, shellcheck, markdownlint, hadolint, taplo, prettier (Makefile)"
cwd = "."
cmd = "make static"

[[checks]]
name = "unit tests (Makefile:51)"
cwd = "."
cmd = "make test"
